# Nginx Reverse Proxy Configuration for Cloud Student System
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    location /static/ {
        alias /opt/cloud_student_system/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Custom Error Pages
    error_page 403 /templates/errors/403.html;
    error_page 404 /templates/errors/404.html;
    error_page 500 502 503 504 /templates/errors/500.html;
}
