{% extends "base.html" %}
{% block title %}System Login - Cloud Student Management{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow-lg p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-cloud-sun text-primary display-4"></i>
                    <h3 class="mt-2 fw-bold">Cloud Student Portal</h3>
                    <p class="text-muted small">AWS Deployed Attendance & Performance Management</p>
                </div>

                <form action="/login" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label for="email" class="form-label font-weight-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@university.edu" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label font-weight-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
                </form>

                <!-- Quick Fill Buttons for Live Viva Demo -->
                <div class="mt-4 pt-3 border-top text-center">
                    <p class="text-muted small mb-2"><i class="fa-solid fa-bolt text-warning me-1"></i>Quick Demo Login Credentials (Viva Demo):</p>
                    <div class="btn-group btn-group-sm w-100" role="group">
                        <button type="button" class="btn btn-outline-secondary" onclick="quickFill('admin@university.edu', 'Admin@123')">Admin</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="quickFill('prof.sharma@university.edu', 'Faculty@123')">Faculty</button>
                        <button type="button" class="btn btn-outline-danger" onclick="quickFill('student13@university.edu', 'Student@123')">Student (<75%)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function quickFill(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
