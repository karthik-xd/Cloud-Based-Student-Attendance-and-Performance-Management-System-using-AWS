{% extends "base.html" %}
{% block title %}500 Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center my-5 text-center">
    <div class="col-md-6">
        <h1 class="display-1 fw-bold text-danger"><i class="fa-solid fa-server me-3"></i>500</h1>
        <h3 class="fw-bold">Internal Server Error</h3>
        <p class="text-muted">An unexpected error occurred on the cloud server. Please try again or check CloudWatch logs.</p>
        <a href="/" class="btn btn-primary mt-3"><i class="fa-solid fa-house me-1"></i>Return to Homepage</a>
    </div>
</div>
{% endblock %}
